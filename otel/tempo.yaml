# FinPay trace backend (OBSERVABILITY.md) — Tempo. Accepts OTLP from the
# otel-collector (tempo:4317) and serves trace queries to Grafana on :3200.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc: {}
        http: {}

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks