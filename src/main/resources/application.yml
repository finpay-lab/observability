server:
  port: 8090
spring:
  application:
    name: observability

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      service: observability
  tracing:
    sampling:
      probability: 1.0

finpay:
  observability:
    otel:
      collector-endpoint: http://otel-collector.finpay-infra.svc.cluster.local:4317
    llm:
      byok-secret-ref: ai-key
      timeout-seconds: 20
    dashboards-dir: classpath:grafana/dashboards
