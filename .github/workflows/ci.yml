# CI. Proves the repo builds and that the observability config (Prometheus
# rules, Grafana dashboards, OTel collector, compose) is valid on every
# push/PR. Static analysis & dependency scanning arrive with the quality phase.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test all modules
        run: ./gradlew clean build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/**/*
          retention-days: 7

  infra-config:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

  observability-lint:
    name: Lint dashboards, Prometheus rules, OTel YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dashboards + YAML (render checks)
        run: |
          pip install --quiet pyyaml
          python scripts/lint-observability.py

      - name: Validate Prometheus scrape config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus alerting rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check rules /etc/prometheus/alert-rules.yml