# FinPay observability stack (OBSERVABILITY.md). Bring up with:
#
#   docker compose up -d
#
#   Prometheus   http://localhost:9090   (alerts + rules)
#   Grafana      http://localhost:3000   (admin/admin, dashboards auto-provisioned)
#   OTel collector :4317   :4318   :8888   :8889
#   Tempo        http://localhost:3200
#
# The FinPay *business* services run in their own repos against the platform
# compose (docker-compose.yml in finpay-lab/platform); their /actuator/prometheus
# targets are registered in prometheus/targets/services.yml.

name: finpay-observability

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: finpay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.2
    container_name: finpay-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: finpay-otel-collector
    ports:
      - "4317:4317" # OTLP/gRPC
      - "4318:4318" # OTLP/HTTP
      - "8888:8888" # own process metrics
      - "8889:8889" # span/op metrics re-export
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: finpay-tempo
    ports:
      - "3200:3200"
    volumes:
      - ./otel/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    command: ["--config.file=/etc/tempo.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  prometheus-data:
  grafana-data:
  tempo-data: