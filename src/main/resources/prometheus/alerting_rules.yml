groups:
  - name: finpay_saga_alerts
    rules:
      - alert: TransferSagaFailureRateHigh
        expr: sum(rate(finpay_transfer_saga_failed_total[5m])) / sum(rate(finpay_transfer_saga_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "Transfer SAGA failure rate > 5% over 5m"
          runbook_url: "https://runbooks.finpay.local/transfer-saga"
      - alert: LedgerAnomalyDetected
        expr: finpay_anomaly_score > 0.8
        for: 1m
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "Ledger anomaly score above threshold"
          runbook_url: "https://runbooks.finpay.local/ledger-anomaly"
      - alert: ServiceLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (service, le)) > 1.0
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "p99 latency > 1s"
          runbook_url: "https://runbooks.finpay.local/latency"
