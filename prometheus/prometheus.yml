# FinPay Prometheus (OBSERVABILITY.md). Pull model: each service exposes
# /actuator/prometheus; the OTel collector exports its span metrics on :8889 and
# its own process metrics on :8888. Alerting rules live in alert-rules.yml and
# are evaluated every evaluation_interval.
#
# Run with: docker compose up -d prometheus   (see docker-compose.yml)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: finpay-local

# No Alertmanager in the lab stack yet; drop targets here when one is added
# (collector/Helm phase wires the real one).
alerting:
  alertmanagers: []

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # --- Metrics producer (exporter) targets -----------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]

  # Ops metrics re-exported by the collector's Prometheus exporter (span/RED
  # metrics derived from traces; see otel/otel-collector.yaml).
  - job_name: "otel-collector-ops"
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "grafana"
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  # --- FinPay business services ----------------------------------------------
  # Registered in prometheus/targets/services.yml (file_sd) as each service goes
  # live for local dev or the lab compose network; Prometheus picks up the file
  # without a restart. Example entry:
  #   - labels:
  #       service: identity-service
  #     targets: ["host.docker.internal:8082"]
  - job_name: "finpay-services"
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
    relabel_configs:
      - source_labels: [service]
        target_label: job